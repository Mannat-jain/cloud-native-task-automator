# Test profile: in-memory H2 (PostgreSQL compatibility mode) instead of a real Postgres.
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# The background poller is switched off so tests are deterministic; the worker has its own test that enables it.
app.worker.enabled=false
# Fast retries in tests
app.retry.base-delay-ms=100
app.retry.max-delay-ms=1000
