spring.application.name=task-automator

# =========================================================================
# Database. Everything can be overridden with environment variables so no
# secret ever lives in the repository (see .env.example / docker-compose.yml).
# The password has NO default on purpose.
# =========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================================
# HikariCP connection pool
# =========================================================================
spring.datasource.hikari.pool-name=task-pool
# Keep the pool small: a handful of connections + queueing beats hundreds of connections thrashing Postgres.
# (Sum of pool sizes of ALL app instances must stay below Postgres max_connections, default 100.)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
# How long a request waits for a free connection before failing with a timeout.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# Retire connections before Postgres / a firewall silently drops them.
spring.datasource.hikari.max-lifetime=1800000
# Log a warning if a connection is held for more than 20 s (finds leaks and long transactions).
spring.datasource.hikari.leak-detection-threshold=20000
# 60-second READINESS WINDOW: at start-up the pool keeps retrying for up to 60 s instead of failing
# immediately when Postgres is still booting (cold start, slow disk, container start order).
# docker-compose.yml also gates the app on a Postgres healthcheck, so the two mechanisms back each other up.
spring.datasource.hikari.initialization-fail-timeout=60000

# =========================================================================
# JPA / Hibernate
# =========================================================================
# 'update' keeps this demo zero-setup. A production system should use 'validate' + Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
# Do not keep a DB connection open for the whole HTTP request (pool starvation, lazy-loading surprises).
spring.jpa.open-in-view=false

# =========================================================================
# Background worker (retrying task executor) - all values are overridable
# =========================================================================
app.worker.enabled=true
app.worker.poll-interval-ms=2000
app.worker.initial-delay-ms=5000
app.worker.batch-size=10
app.worker.threads=4
app.worker.queue-capacity=100
# A task that has been RUNNING for longer than this is assumed to belong to a dead worker and is requeued.
app.worker.stale-after-seconds=300
# Retry backoff: 2s, 4s, 8s, ... capped at 5 minutes.
app.retry.base-delay-ms=2000
app.retry.max-delay-ms=300000

# =========================================================================
# Actuator (health endpoint used by Docker / Kubernetes probes)
# =========================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
