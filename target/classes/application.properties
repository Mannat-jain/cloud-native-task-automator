# =========================================================================
# Database Connectivity Configuration (With Environment Variable Overrides)
# =========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:taskpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================================
# Java Persistence API (JPA) & Object-Relational Mapping (ORM) Settings
# =========================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' automatically updates database tables based on structural changes in your entities
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

# =========================================================================
# Application Resiliency Tuning
# =========================================================================
# Instructs Spring Boot to retry connecting to PostgreSQL if the database engine container
# is still initializing during initial boot sequences
spring.datasource.hikari.initialization-fail-timeout=60000